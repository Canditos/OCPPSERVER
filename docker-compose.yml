services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/ocpp16.db
    volumes:
      - ocpp_db:/app/data
    networks:
      - default
      - coolify
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    networks:
      - default
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ocpp-frontend.entryPoints=http,https"
      - "traefik.http.routers.ocpp-frontend.rule=Host(`ocpp.gatoescondido.com`)"
      - "traefik.http.routers.ocpp-frontend.service=ocpp-frontend"
      - "traefik.http.services.ocpp-frontend.loadbalancer.server.port=80"
    restart: unless-stopped

volumes:
  ocpp_db:

networks:
  coolify:
    external: true
