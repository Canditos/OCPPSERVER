services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/ocpp16.db
    volumes:
      - ocpp_db:/app/data
    networks:
      - default
      - coolify
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    networks:
      - default
      - coolify
    labels:
      - "caddy_0=https://ocpp.gatoescondido.com"
      - "caddy_0.handle_path=/*"
      - "caddy_0.handle_path.0_reverse_proxy={{upstreams 80}}"
      - "caddy_ingress_network=coolify"
    restart: unless-stopped

volumes:
  ocpp_db:

networks:
  coolify:
    external: true
