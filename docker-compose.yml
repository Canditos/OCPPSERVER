services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ocpp_data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/ocpp16.db
      - PORT=8000
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://ocpp.gatoescondido.com}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-}
    networks:
      - default
      - coolify
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    labels:
      - "traefik.docker.network=coolify"
    networks:
      - default
      - coolify
    restart: always



volumes:
  ocpp_data:

networks:
  coolify:
    external: true
