services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/ocpp16.db
    volumes:
      - ocpp_db:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8180:80"
    restart: unless-stopped

volumes:
  ocpp_db:
