services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ocpp_data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/ocpp16.db
      - PORT=8000
    networks:
      - default
      - coolify
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    networks:
      - default
      - coolify
    restart: always



volumes:
  ocpp_data:

networks:
  coolify:
    external: true
